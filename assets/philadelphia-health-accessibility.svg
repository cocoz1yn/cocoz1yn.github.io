<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Health accessibility: proposed research workflow</title>
  <desc id="desc">Healthcare facilities and neighborhood indicators will be brought together for interactive mapping and accessibility analysis.</desc>
  <rect width="800" height="500" fill="#bcc1c3"/>
  <g fill="none" stroke="#8d969c" stroke-width="1"><path d="M44 86H756M44 440H756"/><path d="M362 182H410V326H362M410 254H448"/></g>
  <g font-family="Arial, sans-serif" fill="#595d66" font-size="12" letter-spacing="2"><text x="44" y="470">PHILADELPHIA / PROPOSED RESEARCH</text></g>
  <g font-family="Arial, sans-serif" fill="#272b36">
    <rect x="44" y="128" width="318" height="108" fill="#d7d7d6"/>
    <path d="M74 164V194M59 179H89" stroke="#595d66" stroke-width="3"/>
    <text x="110" y="174" font-size="19">Healthcare facilities</text><text x="110" y="203" font-size="14" fill="#595d66">Services / Locations / Ownership</text>
    <rect x="44" y="272" width="318" height="108" fill="#d7d7d6"/>
    <g stroke="#595d66" fill="none"><rect x="60" y="306" width="29" height="29"/><path d="M60 320H89M74 306V335"/></g>
    <text x="110" y="318" font-size="19">Census tract indicators</text><text x="110" y="347" font-size="14" fill="#595d66">Income / Insurance / Demographics</text>
    <rect x="448" y="128" width="308" height="252" fill="#d7d7d6"/>
    <text x="474" y="170" font-size="19">Explore accessibility</text>
    <g stroke="#a08a81"><path d="M474 192H730M474 248H730M474 304H730"/></g>
    <g font-size="16" fill="#595d66"><text x="474" y="226">Interactive facility map</text><text x="474" y="282">Neighborhood comparisons</text><text x="474" y="338">Spatial &amp; statistical analysis</text></g>
  </g>
  <text x="448" y="417" font-family="Arial, sans-serif" font-size="14" fill="#595d66">Mapping availability. Examining disparities.</text>
</svg>
